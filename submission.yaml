submission:
  title: "GridShield — Civil-Engineering-Aware Power Grid Advisor"
  problem_statement: >
    Grid operators cannot determine which assets to inspect first because
    electrical sensor data (temperature, vibration, partial discharge, oil
    quality), civil-engineering condition data (drainage quality, corrosion
    score, foundation tilt, erosion index), and 3-day weather forecasts are
    tracked in separate silos with no unified view. The result is reactive,
    calendar-based maintenance schedules that miss high-risk assets until
    failure occurs, driving unnecessary outages, repair costs, and safety
    incidents that targeted preventive action could have avoided.
  solution_summary: >
    GridShield fuses all three data streams into a transparent, rule-based
    risk_score (0–100) built from 13 named, auditable factors. Assets are
    then ranked by a priority_score calculated as expected outage cost
    (customers × criticality × probability of failure) divided by
    intervention cost, so operators know exactly which asset to fix first
    and why — with no hidden model weights, no black-box outputs, and a
    full per-factor breakdown available for every asset in the queue.
  key_features:
    - "Rule-based transparent scoring across 13 auditable factors (no black-box ML)"
    - "Ranked asset priority queue under live weather scenarios and time horizons"
    - "Conversational advisor chat for querying and comparing assets"
    - "Stress-tested evaluation panel with Recall@Top-10 and loss-avoided metrics"
    - "Interactive Leaflet.js Grid Map with 40 color-coded asset markers and clickable popups"

  tech_stack:
    languages:
      - "Python"
      - "JavaScript"
      - "HTML"
      - "CSS"
    frameworks:
      - "Streamlit"
      - "pytest"
      - "Leaflet.js"
    ibm_technologies:
      - "IBM Bob 2.0"
    databases: []
    other:
      - "pandas"
      - "OpenStreetMap"
      - "GitHub Pages"

  what_we_are_most_proud_of: >
    The safety architecture is the strongest part of the submission. The advisor
    genuinely refuses control requests (test-verified in 91 unit tests). Every
    output row carries a hard-coded safety note enforced in the data pipeline
    itself, not just the UI. The delta-based asset comparison produces an
    explicit contrast sentence and factor-level diff rather than two parallel
    summaries, and the priority formula cleanly separates raw risk_score from
    priority_score so a cheap-to-fix hospital transformer correctly outranks a
    more expensive remote pole — fully auditable with no hidden weights.

  known_limitations: >
    All electrical sensor readings are synthetic (parametric distributions) —
    real IoT calibration is required for production. Intervention costs are
    approximate placeholders; a real deployment needs utility-calibrated cost
    data. The 13-factor rule-based scoring cannot detect novel failure modes
    outside its defined factors. Risk scores are stateless (no drift detection
    or trend analysis). Weather is aggregated as max over a 3-day window rather
    than hourly resolution.

